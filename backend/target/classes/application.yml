server:
  port: 8080

spring:
  application:
    name: zoo-reserve-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/zoo_reserve?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  sql:
    init:
      mode: never
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

springdoc:
  swagger-ui:
    path: /swagger-ui.html

mybatis-plus:
  global-config:
    banner: false
  configuration:
    map-underscore-to-camel-case: true

zoo-reserve:
  storage:
    provider: mock
  mq:
    provider: mock
  payment:
    provider: mock
